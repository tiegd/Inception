services:
    mariadb:
        container_name: mariadb
        image: mariadb
        build: requirements/mariadb
        env_file: .env
        secrets:
            - db_password
            - db_root_password
        volumes:
            - mariadb_data:/var/lib/mysql
        networks:
            - inception
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

    wordpress:
        container_name: wordpress
        image: wordpress
        build: requirements/wordpress
        env_file: .env
        secrets:
            - db_password
            - credentials
        depends_on:
            mariadb:
                condition: service_healthy
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        restart: unless-stopped

    nginx:
        container_name: nginx
        image: nginx
        build: requirements/nginx
        depends_on:
            - wordpress
        ports:
            - "443:443"
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        restart: unless-stopped

volumes:
    mariadb_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/${LOGIN}/data/mariadb
    wordpress_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/${LOGIN}/data/wordpress

networks:
    inception:
        driver: bridge

secrets:
    db_password:
        file: ../secrets/db_password.txt
    db_root_password:
        file: ../secrets/db_root_password.txt
    credentials:
        file: ../secrets/credentials.txt